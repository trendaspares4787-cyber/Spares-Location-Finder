
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spares Location Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coffee: {
                50: '#FFFEFB',
                100: '#FAF8F2',
                200: '#F5EFE6',
                300: '#E8D5C4',
                400: '#A68A64',
                500: '#936639',
                600: '#7F5539',
                700: '#582F0E',
                800: '#3D2009',
                900: '#1F1105',
              }
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --brand-primary: #7F5539;
            --brand-secondary: #582F0E;
            --brand-accent: #A68A64;
            --premium-gradient-1: linear-gradient(135deg, #7F5539 0%, #3D2009 100%);
            --premium-gradient-2: linear-gradient(135deg, #E8D5C4 0%, #A68A64 100%);
            --premium-gradient-3: linear-gradient(135deg, #FFFEFB 0%, #E8D5C4 100%);
            --premium-gradient-4: linear-gradient(135deg, #A68A64 0%, #7F5539 100%);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF;
            background-image: 
                radial-gradient(at 100% 0%, #FFFCF5 0, transparent 40%),
                radial-gradient(at 0% 100%, #FAF8F2 0, transparent 40%);
            color: #3D2009;
            min-height: 100vh;
        }
        .premium-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(127, 85, 57, 0.05);
            box-shadow: 0 30px 60px -12px rgba(61, 32, 9, 0.08);
        }
        .grad-primary { background: var(--premium-gradient-1); }
        .grad-warm { background: var(--premium-gradient-2); }
        .grad-fresh { background: var(--premium-gradient-3); }
        .grad-royal { background: var(--premium-gradient-4); }

        .glass-nav {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(40px);
            border-top: 1px solid rgba(127, 85, 57, 0.08);
        }
        
        .premium-input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1.5px solid #F5EFE6;
            background: #FFFFFF;
        }
        .premium-input:focus {
            border-color: #7F5539;
            box-shadow: 0 0 40px rgba(127, 85, 57, 0.05);
        }

        @media print {
            .no-print { display: none !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "jspdf": "https://esm.sh/jspdf@^4.0.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@^5.0.7"
  }
}
</script>
</head>
<body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
